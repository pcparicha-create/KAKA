<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KAKA - Home</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f1115;
            color: white;
            min-height: 100vh;
        }


        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;

            width: 230px;
            height: 100vh;

            background: #17191f;

            padding: 25px 15px;

            border-right: 1px solid #292c33;
        }


        .logo {
            font-size: 28px;
            font-weight: bold;

            text-align: center;

            margin-bottom: 40px;

            letter-spacing: 2px;
        }


        .nav-btn {
            width: 100%;

            padding: 14px;

            margin-bottom: 10px;

            border: none;

            border-radius: 10px;

            background: transparent;

            color: #bfc2c9;

            text-align: left;

            font-size: 15px;

            cursor: pointer;

            transition: 0.2s;
        }


        .nav-btn:hover {
            background: #252830;
            color: white;
        }


        .nav-btn.active {
            background: #2d313a;
            color: white;
        }


        /* LOGOUT */

        .logout {
            margin-top: 30px;
            color: #ff6b6b;
        }


        .logout:hover {
            background: #352326;
            color: #ff8585;
        }


        /* MAIN */

        .main {
            margin-left: 230px;
            padding: 40px;
        }


        .header {
            margin-bottom: 30px;
        }


        .header h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }


        .header p {
            color: #8d929d;
        }


        /* PROFIT CARD */

        .profit-card {
            background: #17191f;

            border: 1px solid #292c33;

            border-radius: 20px;

            padding: 30px;

            margin-bottom: 25px;
        }


        .profit-label {
            color: #8d929d;

            font-size: 14px;

            margin-bottom: 10px;
        }


        .profit {
            font-size: 42px;

            font-weight: bold;

            margin-bottom: 10px;
        }


        .month {
            color: #8d929d;

            font-size: 14px;
        }


        /* STATS */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 25px;
        }


        .stat-card {
            background: #17191f;

            border: 1px solid #292c33;

            border-radius: 16px;

            padding: 22px;
        }


        .stat-title {
            color: #8d929d;

            font-size: 13px;

            margin-bottom: 10px;
        }


        .stat-value {
            font-size: 24px;

            font-weight: bold;
        }


        /* SECTIONS */

        .section {
            background: #17191f;

            border: 1px solid #292c33;

            border-radius: 18px;

            padding: 25px;

            margin-bottom: 25px;
        }


        .section h2 {
            font-size: 20px;

            margin-bottom: 20px;
        }


        /* QUICK ACTIONS */

        .actions {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;
        }


        .action {
            background: #20232a;

            border: 1px solid #343841;

            border-radius: 12px;

            padding: 20px;

            color: white;

            cursor: pointer;

            font-size: 15px;

            transition: 0.2s;
        }


        .action:hover {
            background: #292d36;

            transform: translateY(-2px);
        }


        /* MONTHLY PROFITS */

        .month-row {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 15px;

            margin-bottom: 10px;

            background: #20232a;

            border-radius: 10px;
        }


        .month-name {
            font-weight: bold;
        }


        .month-profit {
            font-weight: bold;
        }


        /* EMPTY */

        .empty {
            color: #777c86;

            text-align: center;

            padding: 20px;
        }


        /* MOBILE */

        @media (max-width: 800px) {

            .sidebar {
                position: relative;

                width: 100%;

                height: auto;

                border-right: none;

                border-bottom:
                    1px solid #292c33;
            }


            .logo {
                margin-bottom: 20px;
            }


            .nav-btn {
                display: inline-block;

                width: auto;

                margin-right: 5px;

                padding: 10px 12px;
            }


            .logout {
                margin-top: 0;
            }


            .main {
                margin-left: 0;

                padding: 20px;
            }


            .stats {
                grid-template-columns: 1fr;
            }


            .actions {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">
            KAKA
        </div>


        <button
            class="nav-btn active"
            onclick="location.href='KAKAPROJ(home).html'">

            🏠 Home

        </button>


        <button
            class="nav-btn"
            onclick="location.href='ItemsKAKA.html'">

            📦 Inventory

        </button>


        <button
            class="nav-btn"
            onclick="location.href='buyKAKA.html'">

            🛒 Buy

        </button>


        <button
            class="nav-btn"
            onclick="location.href='sellKAKA.html'">

            💰 Sell

        </button>


        <button
            class="nav-btn"
            onclick="location.href='histroyKAKA.html'">

            📜 History

        </button>


        <button
            class="nav-btn logout"
            onclick="logout()">

            🚪 Logout

        </button>

    </div>


    <!-- MAIN -->

    <div class="main">


        <div class="header">

            <h1>
                Dashboard
            </h1>

            <p>
                Welcome to your KAKA inventory system.
            </p>

        </div>


        <!-- CURRENT PROFIT -->

        <div class="profit-card">

            <div class="profit-label">
                CURRENT MONTH PROFIT
            </div>


            <div
                class="profit"
                id="profit">

                ₹0.00

            </div>


            <div
                class="month"
                id="month">

            </div>

        </div>


        <!-- STATS -->

        <div class="stats">


            <div class="stat-card">

                <div class="stat-title">
                    TOTAL BOUGHT
                </div>


                <div
                    class="stat-value"
                    id="bought">

                    ₹0.00

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    TOTAL SOLD
                </div>


                <div
                    class="stat-value"
                    id="sold">

                    ₹0.00

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    ITEMS IN INVENTORY
                </div>


                <div
                    class="stat-value"
                    id="items">

                    0

                </div>

            </div>

        </div>


        <!-- QUICK ACTIONS -->

        <div class="section">

            <h2>
                Quick Actions
            </h2>


            <div class="actions">


                <button
                    class="action"
                    onclick="location.href='ItemsKAKA.html'">

                    📦 Manage Inventory

                </button>


                <button
                    class="action"
                    onclick="location.href='buyKAKA.html'">

                    🛒 Buy Stock

                </button>


                <button
                    class="action"
                    onclick="location.href='sellKAKA.html'">

                    💰 Sell Stock

                </button>

            </div>

        </div>


        <!-- MONTHLY PROFITS -->

        <div class="section">

            <h2>
                Monthly Profits
            </h2>


            <div id="monthlyProfits">

            </div>

        </div>


    </div>


    <script>


        /* =========================
           LOGIN PROTECTION
        ========================= */

        if (
            localStorage.getItem("loggedIn")
            !== "true"
        ) {

            location.href =
                "login PAGE1.html";

        }


        /* =========================
           LOGOUT
        ========================= */

        function logout() {

            localStorage.removeItem(
                "loggedIn"
            );

            location.href =
                "login PAGE1.html";

        }


        /* =========================
           GET DATA
        ========================= */

        let amountBought =
            Number(
                localStorage.getItem(
                    "amountBought"
                )
            ) || 0;


        let amountSold =
            Number(
                localStorage.getItem(
                    "amountSold"
                )
            ) || 0;


        let items =
            JSON.parse(
                localStorage.getItem(
                    "items"
                )
            ) || [];


        let monthlyProfits =
            JSON.parse(
                localStorage.getItem(
                    "monthlyProfits"
                )
            ) || [];


        /* =========================
           CURRENT MONTH
        ========================= */

        let currentMonth =
            Number(
                localStorage.getItem(
                    "currentMonth"
                )
            );


        if (!currentMonth) {

            currentMonth = 1;

            localStorage.setItem(
                "currentMonth",
                currentMonth
            );

        }


        /* =========================
           REAL STARTING MONTH
        ========================= */

        const realStartingMonth =
            new Date().getMonth();


        function getMonthName(monthNumber) {

            const months = [

                "January",
                "February",
                "March",
                "April",
                "May",
                "June",
                "July",
                "August",
                "September",
                "October",
                "November",
                "December"

            ];


            return months[
                (
                    realStartingMonth
                    + monthNumber
                    - 1
                ) % 12
            ];

        }


        /* =========================
           CURRENT MONTH DISPLAY
        ========================= */

        document.getElementById(
            "month"
        ).innerHTML =

            "Month " +
            currentMonth +
            " • " +
            getMonthName(
                currentMonth
            );


        /* =========================
           PROFIT
        ========================= */

        let profit =
            amountSold - amountBought;


        document.getElementById(
            "profit"
        ).innerHTML =

            "₹" +
            profit.toFixed(2);


        /* =========================
           BOUGHT
        ========================= */

        document.getElementById(
            "bought"
        ).innerHTML =

            "₹" +
            amountBought.toFixed(2);


        /* =========================
           SOLD
        ========================= */

        document.getElementById(
            "sold"
        ).innerHTML =

            "₹" +
            amountSold.toFixed(2);


        /* =========================
           INVENTORY COUNT
        ========================= */

        document.getElementById(
            "items"
        ).innerHTML =
            items.length;


        /* =========================
           MONTHLY PROFITS
        ========================= */

        const monthlyDiv =
            document.getElementById(
                "monthlyProfits"
            );


        if (
            monthlyProfits.length === 0
        ) {

            monthlyDiv.innerHTML = `

                <div class="empty">

                    No completed months yet.

                </div>

            `;

        }

        else {

            monthlyDiv.innerHTML = "";


            monthlyProfits
                .slice()
                .reverse()
                .forEach(record => {


                    monthlyDiv.innerHTML += `

                        <div class="month-row">


                            <div>


                                <div
                                    class="month-name">

                                    Month
                                    ${record.monthNumber}

                                    •

                                    ${record.monthName}

                                </div>


                                <div
                                    style="
                                    color:#858a95;
                                    font-size:13px;
                                    margin-top:5px;
                                    ">

                                    Bought:

                                    ₹${Number(
                                        record.bought
                                    ).toFixed(2)}

                                    &nbsp; • &nbsp;

                                    Sold:

                                    ₹${Number(
                                        record.sold
                                    ).toFixed(2)}

                                </div>


                            </div>


                            <div
                                class="month-profit">

                                ₹${Number(
                                    record.profit
                                ).toFixed(2)}

                            </div>


                        </div>

                    `;

                });

        }

    </script>

</body>

</html>
