<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KAKA - Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f1115;
            color: white;
            min-height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;

            width: 230px;
            height: 100vh;

            background: #17191f;
            border-right: 1px solid #292c33;

            padding: 25px 15px;
        }

        .logo {
            text-align: center;

            font-size: 30px;
            font-weight: bold;
            letter-spacing: 4px;

            margin-bottom: 40px;
        }

        .nav-btn {
            display: block;

            width: 100%;

            padding: 13px 15px;
            margin-bottom: 8px;

            background: transparent;
            color: #aeb3bd;

            border: none;
            border-radius: 9px;

            text-align: left;
            font-size: 15px;

            cursor: pointer;
            text-decoration: none;

            transition: 0.2s;
        }

        .nav-btn:hover {
            background: #24272e;
            color: white;
        }

        .nav-btn.active {
            background: white;
            color: #111;
            font-weight: bold;
        }

        .logout {
            position: absolute;

            bottom: 25px;
            left: 15px;

            width: calc(100% - 30px);

            background: #20232a;
            color: #ff7777;
        }

        .logout:hover {
            background: #2b2022;
            color: #ff9999;
        }


        /* MAIN */

        .main {
            margin-left: 230px;

            padding: 40px;
        }

        .top {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 30px;
        }

        h1 {
            font-size: 32px;
        }

        .subtitle {
            color: #858a95;

            margin-top: 6px;

            font-size: 14px;
        }


        /* SAVE BUTTON */

        .save-btn {
            background: white;
            color: #111;

            border: none;

            padding: 12px 20px;

            border-radius: 9px;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .save-btn:hover {
            background: #dddddd;

            transform: translateY(-2px);
        }

        .save-btn:active {
            transform: translateY(0);
        }

        #saveMessage {
            color: #7ee787;

            font-size: 13px;

            margin-top: 8px;

            text-align: right;

            min-height: 16px;
        }


        /* STATS */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 30px;
        }

        .stat-card {
            background: #17191f;

            border: 1px solid #292c33;

            border-radius: 14px;

            padding: 22px;

            transition: 0.2s;
        }

        .stat-card:hover {
            border-color: #41444d;

            transform: translateY(-2px);
        }

        .stat-title {
            color: #858a95;

            font-size: 13px;

            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 25px;

            font-weight: bold;
        }

        .profit {
            color: #7ee787;
        }

        .bought {
            color: #ffb86c;
        }

        .sold {
            color: #78a9ff;
        }

        .items {
            color: #c792ea;
        }


        /* SECTION */

        .section {
            background: #17191f;

            border: 1px solid #292c33;

            border-radius: 15px;

            padding: 25px;

            margin-bottom: 25px;
        }

        .section-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .section-header h2 {
            font-size: 20px;
        }


        /* QUICK ACTIONS */

        .actions {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;
        }

        .action-btn {
            padding: 18px;

            background: #20232a;

            color: white;

            border: 1px solid #292c33;

            border-radius: 10px;

            text-decoration: none;

            text-align: center;

            font-weight: bold;

            transition: 0.2s;
        }

        .action-btn:hover {
            background: #292c33;

            transform: translateY(-2px);
        }


        /* MONTHLY PROFITS */

        .month-list {
            display: flex;

            flex-direction: column;

            gap: 10px;
        }

        .month {
            display: grid;

            grid-template-columns:
                100px
                1fr
                1fr
                1fr;

            align-items: center;

            gap: 15px;

            padding: 15px;

            background: #20232a;

            border-radius: 9px;
        }

        .month-name {
            font-weight: bold;
        }

        .month-data {
            color: #aeb3bd;

            font-size: 13px;
        }

        .month-profit {
            color: #7ee787;

            font-weight: bold;
        }


        /* EMPTY */

        .empty {
            color: #686d77;

            text-align: center;

            padding: 25px;
        }


        /* RESPONSIVE */

        @media (max-width: 1000px) {

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .actions {
                grid-template-columns:
                    1fr 1fr;
            }
        }


        @media (max-width: 700px) {

            .sidebar {
                width: 180px;
            }

            .main {
                margin-left: 180px;

                padding: 25px;
            }

            .top {
                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }

            .save-btn {
                width: 100%;
            }

            #saveMessage {
                text-align: left;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .actions {
                grid-template-columns: 1fr;
            }

            .month {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>


<body>


    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">
            KAKA
        </div>


        <a
            class="nav-btn active"
            href="KAKAPROJ(home).html"
        >
            Home
        </a>


        <a
            class="nav-btn"
            href="ItemsKAKA.html"
        >
            Inventory
        </a>


        <a
            class="nav-btn"
            href="buyKAKA.html"
        >
            Buy
        </a>


        <a
            class="nav-btn"
            href="sellKAKA.html"
        >
            Sell
        </a>


        <a
            class="nav-btn"
            href="histroyKAKA.html"
        >
            History
        </a>


        <button
            class="nav-btn logout"
            onclick="logout()"
        >
            Logout
        </button>

    </div>


    <!-- MAIN -->

    <div class="main">


        <!-- TOP -->

        <div class="top">

            <div>

                <h1>
                    Dashboard
                </h1>

                <p class="subtitle">
                    Welcome to your KAKA Inventory Management System
                </p>

            </div>


            <div>

                <button
                    class="save-btn"
                    onclick="saveProgress()"
                >
                    💾 SAVE PROGRESS
                </button>

                <div id="saveMessage"></div>

            </div>

        </div>


        <!-- STATS -->

        <div class="stats">


            <!-- PROFIT -->

            <div class="stat-card">

                <div class="stat-title">
                    Current Month Profit
                </div>

                <div
                    class="stat-value profit"
                    id="profit"
                >
                    ₹0.00
                </div>

            </div>


            <!-- BOUGHT -->

            <div class="stat-card">

                <div class="stat-title">
                    Total Bought
                </div>

                <div
                    class="stat-value bought"
                    id="bought"
                >
                    ₹0.00
                </div>

            </div>


            <!-- SOLD -->

            <div class="stat-card">

                <div class="stat-title">
                    Total Sold
                </div>

                <div
                    class="stat-value sold"
                    id="sold"
                >
                    ₹0.00
                </div>

            </div>


            <!-- ITEMS -->

            <div class="stat-card">

                <div class="stat-title">
                    Items in Inventory
                </div>

                <div
                    class="stat-value items"
                    id="items"
                >
                    0
                </div>

            </div>

        </div>


        <!-- QUICK ACTIONS -->

        <div class="section">

            <div class="section-header">

                <h2>
                    Quick Actions
                </h2>

            </div>


            <div class="actions">


                <a
                    class="action-btn"
                    href="ItemsKAKA.html"
                >
                    📦 Inventory
                </a>


                <a
                    class="action-btn"
                    href="buyKAKA.html"
                >
                    🛒 Buy Stock
                </a>


                <a
                    class="action-btn"
                    href="sellKAKA.html"
                >
                    💰 Sell Stock
                </a>

            </div>

        </div>


        <!-- MONTHLY PROFITS -->

        <div class="section">

            <div class="section-header">

                <h2>
                    Monthly Profits
                </h2>

            </div>


            <div
                class="month-list"
                id="monthList"
            ></div>

        </div>


    </div>


    <script>


        /* LOGIN PROTECTION */

        if (
            localStorage.getItem("loggedIn")
            !==
            "true"
        ) {

            location.href =
                "login PAGE1.html";

        }


        /* LOAD DATA */

        let items =
            JSON.parse(
                localStorage.getItem("items")
            ) || [];


        let amountBought =
            Number(
                localStorage.getItem(
                    "amountBought"
                )
            ) || 0;


        let amountSold =
            Number(
                localStorage.getItem(
                    "amountSold"
                )
            ) || 0;


        let transactions =
            JSON.parse(
                localStorage.getItem(
                    "transactions"
                )
            ) || [];


        let monthlyProfits =
            JSON.parse(
                localStorage.getItem(
                    "monthlyProfits"
                )
            ) || [];


        /* CURRENT MONTH */

        let currentMonth =
            Number(
                localStorage.getItem(
                    "currentMonth"
                )
            );


        if (!currentMonth) {

            currentMonth = 1;

            localStorage.setItem(
                "currentMonth",
                currentMonth
            );

        }


        /*
            The real month when
            the KAKA system started.
        */

        const realStartingMonth =
            new Date().getMonth();


        function getMonthName(
            monthNumber
        ) {

            const months = [

                "January",
                "February",
                "March",
                "April",
                "May",
                "June",
                "July",
                "August",
                "September",
                "October",
                "November",
                "December"

            ];


            return months[
                (
                    realStartingMonth
                    +
                    monthNumber
                    -
                    1
                )
                %
                12
            ];

        }


        /* UPDATE DASHBOARD */

        function updateDashboard() {


            /*
                Profit =
                Total Sold - Total Bought
            */

            const profit =
                amountSold -
                amountBought;


            document.getElementById(
                "profit"
            ).textContent =
                "₹" +
                profit.toFixed(2);


            document.getElementById(
                "bought"
            ).textContent =
                "₹" +
                amountBought.toFixed(2);


            document.getElementById(
                "sold"
            ).textContent =
                "₹" +
                amountSold.toFixed(2);


            document.getElementById(
                "items"
            ).textContent =
                items.length;


            displayMonthlyProfits();

        }


        /* MONTHLY PROFITS */

        function displayMonthlyProfits() {

            const list =
                document.getElementById(
                    "monthList"
                );


            list.innerHTML = "";


            if (
                monthlyProfits.length === 0
            ) {

                list.innerHTML = `

                    <div class="empty">
                        No completed months yet.
                    </div>

                `;

                return;

            }


            /*
                Newest month first
            */

            const newestFirst =
                [...monthlyProfits]
                .reverse();


            newestFirst.forEach(
                record => {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "month";


                    div.innerHTML = `

                        <div class="month-name">
                            Month ${record.monthNumber}
                            <br>
                            <small>
                                ${record.monthName}
                            </small>
                        </div>

                        <div class="month-data">
                            Bought:
                            ₹${Number(record.bought).toFixed(2)}
                        </div>

                        <div class="month-data">
                            Sold:
                            ₹${Number(record.sold).toFixed(2)}
                        </div>

                        <div class="month-profit">
                            Profit:
                            ₹${Number(record.profit).toFixed(2)}
                        </div>

                    `;


                    list.appendChild(div);

                }
            );

        }


        /* SAVE PROGRESS */

        function saveProgress() {


            /*
                Save all KAKA data again.

                The other pages already save their
                data automatically, but this button
                makes a manual save as well.
            */


            localStorage.setItem(
                "items",
                JSON.stringify(items)
            );


            localStorage.setItem(
                "amountBought",
                amountBought
            );


            localStorage.setItem(
                "amountSold",
                amountSold
            );


            localStorage.setItem(
                "transactions",
                JSON.stringify(transactions)
            );


            localStorage.setItem(
                "monthlyProfits",
                JSON.stringify(monthlyProfits)
            );


            localStorage.setItem(
                "currentMonth",
                currentMonth
            );


            /*
                Show confirmation
            */

            const message =
                document.getElementById(
                    "saveMessage"
                );


            message.textContent =
                "✓ Progress saved!";


            setTimeout(
                function() {

                    message.textContent = "";

                },
                2500
            );

        }


        /* LOGOUT */

        function logout() {

            localStorage.removeItem(
                "loggedIn"
            );


            location.href =
                "login PAGE1.html";

        }


        /* START */

        updateDashboard();

    </script>

</body>

</html>
